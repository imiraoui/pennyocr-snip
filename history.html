<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>PennyOCR Snip — History</title>
<style>
  :root {
    --paper: #f4efe4; --card: #fdfaf2; --ink: #1c1917; --ink-soft: #44403c;
    --ink-faint: #78716c; --copper: #b87333; --deep: #96562a; --rule: #d3c9b4;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--paper); color: var(--ink); min-height: 100vh;
    font: 13px/1.65 "IBM Plex Mono", ui-monospace, Menlo, monospace;
    padding: 40px 20px;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 16px; letter-spacing: .14em; }
  h1 .coin { color: var(--deep); }
  .sub { font-size: 11px; letter-spacing: .08em; color: var(--ink-faint); margin-top: 3px; }
  .bar { display: flex; gap: 10px; margin: 22px 0 16px; align-items: center; }
  input[type=search] {
    flex: 1; padding: 10px 12px; border: 2px solid var(--ink); background: var(--card);
    font: 12px inherit; font-family: inherit;
  }
  .tbtn {
    background: var(--ink); color: var(--paper); border: 0; cursor: pointer; padding: 10px 14px;
    font: 700 11px inherit; font-family: inherit; letter-spacing: .08em; white-space: nowrap;
  }
  .tbtn.dim { background: none; color: var(--ink-faint); padding: 10px 4px; }
  .entry {
    background: var(--card); border: 1.5px solid var(--rule); padding: 14px 16px;
    margin-bottom: 12px; box-shadow: 4px 4px 0 rgba(28,25,23,.08);
  }
  .ehead { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .when { font-size: 10px; color: var(--ink-faint); letter-spacing: .08em; }
  .acts button {
    background: none; border: 0; cursor: pointer; font: 700 10px inherit; font-family: inherit;
    letter-spacing: .08em; color: var(--deep); padding: 0 0 0 12px;
  }
  .acts button.del { color: var(--ink-faint); }
  pre { white-space: pre-wrap; word-break: break-word; font: 12px/1.7 inherit; }
  .empty { color: var(--ink-faint); padding: 30px 0; text-align: center; }
  .count { font-size: 10px; letter-spacing: .08em; color: var(--ink-faint); }
</style>
</head>
<body>
<div class="wrap">
  <h1>PENNY<span class="coin">_</span>OCR SNIP — HISTORY</h1>
  <div class="sub">EVERY SNIP, NEWEST FIRST · STORED ONLY IN THIS BROWSER</div>
  <div class="bar">
    <input id="q" type="search" placeholder="Search your snips…" />
    <button id="copyAll" class="tbtn">COPY ALL</button>
    <button id="clear" class="tbtn dim">CLEAR ALL</button>
  </div>
  <div class="count" id="count"></div>
  <div id="list"></div>
</div>
<script src="history.js"></script>
</body>
</html>
